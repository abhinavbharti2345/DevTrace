<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container with Cyan Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#06b6d4" stroke-width="2.5" stroke-opacity="0.6"/>

  <!-- Ambient Backdrop Light -->
  <circle cx="34" cy="32" r="16" fill="#06b6d4" fill-opacity="0.18"/>

  <!-- Modern Geometric 'D' with Integrated Graph Node Network -->
  <!-- Vertical Spine -->
  <rect x="17" y="15" width="7" height="34" rx="3.5" fill="url(#cyanBlueGrad)"/>

  <!-- Outer Arc of D -->
  <path d="M22 15 H35 C45 15 51 22 51 32 C51 42 45 49 35 49 H22 V42 H34 C40.5 42 44.5 37.8 44.5 32 C44.5 26.2 40.5 22 34 22 H22 V15 Z" fill="url(#cyanBlueGrad)"/>

  <!-- Center Graph Edge Line -->
  <line x1="20.5" y1="32" x2="34" y2="32" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3"/>

  <!-- Intelligence Graph Nodes (Dots) -->
  <circle cx="17" cy="17" r="3.2" fill="#ffffff" filter="url(#subtleGlow)"/>
  <circle cx="17" cy="47" r="3.2" fill="#38bdf8"/>
  <circle cx="51" cy="32" r="3.8" fill="#38bdf8" stroke="#0b1329" stroke-width="1.5"/>
  <circle cx="34" cy="32" r="2.8" fill="#67e8f9"/>
</svg>
